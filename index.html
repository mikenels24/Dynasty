<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Dynasty</title>

<style>
/* Layout: broadcast franchise menu. Sticky score bug on top, one scrolling column, thumb-zone tab bar at the bottom. */
:root {
  --bg: #0A0F1C;        /* stadium-night navy */
  --panel: #121A2C;     /* card slate */
  --panel-2: #19233B;   /* raised slate */
  --line: #26324F;      /* hairline */
  --fg: #EEF2FA;        /* broadcast white */
  --muted: #8E9AB8;     /* secondary */
  --gold: #F2B33D;      /* accent */
  --gold-ink: #1A1204;  /* text on gold */
  --good: #3ED598;
  --bad: #FF7A7A;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600; color: var(--muted); }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto; }

/* Score bug */
.bug { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bug .wrap { padding-block: 10px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.bug-row { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .08em; }
.brand b { color: var(--gold); font-weight: 800; }
.season-chip { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bug-stats { margin-left: auto; display: flex; gap: 2px; }
.stat-box { background: var(--panel-2); padding: 3px 10px; display: grid; justify-items: center; line-height: 1; min-width: 52px; }
.stat-box:first-child { border-radius: 8px 0 0 8px; }
.stat-box:last-child { border-radius: 0 8px 8px 0; background: var(--gold); color: var(--gold-ink); }
.stat-box small { font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; font-weight: 600; opacity: .8; }
.stat-box span { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.xpbar { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.xpbar .label { white-space: nowrap; }

main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 18px; }
.card, .list, .season-hero, .field { grid-template-columns: minmax(0, 1fr); }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.view-head h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
.view-head .sub { color: var(--muted); font-size: 13px; }

/* Day XP chevron */
.dayxp { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: var(--r); padding: 14px 16px; }
.dayxp .big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: .9; }
.dayxp .big em { font-style: normal; color: var(--gold); }
.dayxp .meta { display: grid; gap: 2px; min-width: 0; }
.dayxp .done-count { margin-left: auto; text-align: right; }

/* Habit rows */
.list { display: grid; gap: 8px; }
.habit { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; background: var(--panel); border-radius: var(--r); padding: 12px 12px 12px 16px; min-height: 68px; position: relative; overflow: hidden; }
.habit::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.habit.done::before { background: var(--gold); }
.habit .info { display: grid; gap: 3px; min-width: 0; }
.habit .name { font-family: var(--font-display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.habit .detail { color: var(--muted); font-size: 13px; }
.habit .detail strong { color: var(--fg); font-weight: 600; }
.pill { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); vertical-align: 1px; margin-left: 6px; }
.habit.done .pill { background: rgba(242,179,61,.16); color: var(--gold); }
.ctrl { display: flex; align-items: center; gap: 6px; }
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; background: var(--panel-2); font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .08s; }
.btn:active { transform: scale(.96); }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .4; }
.check { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check svg { width: 22px; height: 22px; opacity: 0; transition: opacity .15s; }
.habit.done .check { background: var(--gold); border-color: var(--gold); }
.habit.done .check svg { opacity: 1; }
.bottles { display: flex; gap: 4px; margin-top: 2px; }
.bottles i { width: 10px; height: 16px; border-radius: 3px 3px 2px 2px; background: var(--panel-2); border: 1px solid var(--line); }
.bottles i.on { background: var(--gold); border-color: var(--gold); }

/* Final whistle */
.card { background: var(--panel); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.awards { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.awards li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.awards li:last-child { border-bottom: 0; padding-bottom: 0; }
.awards li span:last-child { color: var(--gold); font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* Week strips */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week span { height: 26px; border-radius: 6px; background: var(--panel-2); display: grid; place-items: center; font-family: var(--font-display); font-size: 11px; color: var(--muted); font-weight: 600; }
.week span.on { background: var(--gold); color: var(--gold-ink); }
.week span.future { background: transparent; border: 1px dashed var(--line); }
.week span.today { outline: 1.5px solid var(--fg); outline-offset: -1.5px; }
.streak-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.streak-row .name { font-family: var(--font-display); font-weight: 700; font-size: 17px; text-transform: uppercase; }

/* Player */
.player-card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border-radius: var(--r); padding: 18px 16px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; border: 1px solid var(--line); }
.ovr { width: 92px; height: 92px; border-radius: 16px; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; align-content: center; line-height: .85; }
.ovr b { font-family: var(--font-display); font-weight: 800; font-size: 50px; }
.ovr small { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .2em; }
.player-card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; }
.player-card .who { display: grid; gap: 4px; min-width: 0; }
.attr { display: grid; grid-template-columns: 3.4em 1fr 2.4em; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.attr:last-child { border-bottom: 0; }
.attr .code { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .04em; }
.attr .mid { display: grid; gap: 4px; min-width: 0; }
.attr .mid .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.attr .rating { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-align: right; }
.attr .bar { height: 8px; border-radius: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.attr .bar i { position: absolute; inset: 0 auto 0 0; background: var(--fg); opacity: .85; border-radius: 4px; }
.attr .bar b { position: absolute; top: 0; bottom: 0; background: var(--gold); border-radius: 0 4px 4px 0; }
.focus-tag { font-family: var(--font-display); font-size: 10.5px; letter-spacing: .14em; font-weight: 700; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 0 4px; margin-left: 6px; }

/* Season */
.season-hero { background: var(--panel); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; border: 1px solid var(--line); }
.season-hero h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.focus-list { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--font-display); text-transform: uppercase; font-weight: 700; letter-spacing: .06em; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: rgba(242,179,61,.14); color: var(--gold); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
textarea, input[type=text], input[type=number] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; }
textarea { min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.history { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.history li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.history li:last-child { border-bottom: 0; }
.history .when { color: var(--muted); font-size: 12px; width: 5.5em; flex: none; }
.history .what { flex: 1; min-width: 0; }
.history .x { min-height: 36px; min-width: 36px; border-radius: 8px; color: var(--muted); }
.notice { font-size: 13px; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 10px; }
.notice.warn { border-color: var(--bad); }

/* Tiles, quests, quest lines */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel); border-radius: var(--r); min-height: 76px; padding: 12px 14px; display: grid; align-content: center; gap: 2px; text-align: left; border: 1px solid transparent; }
.tile:active { transform: scale(.98); }
.tile b { font-family: var(--font-display); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; }
.tile span { color: var(--muted); font-size: 12.5px; }
.sect { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -8px; }
.quest { background: var(--panel); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; position: relative; overflow: hidden; }
.quest::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.quest.done::before { background: var(--gold); }
.quest .qtop { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.quest .qname { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; line-height: 1.1; }
.quest .qmeta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.attr-chip { font-family: var(--font-display); font-weight: 700; font-size: 11.5px; letter-spacing: .1em; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--fg); }
.attr-chip.f { background: rgba(242,179,61,.16); color: var(--gold); }
.quest .xp { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--gold); white-space: nowrap; }
.quest.done .qname::after { content: " \2713"; color: var(--gold); }
.chapters { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.chapters i { height: 14px; border-radius: 3px; background: var(--panel-2); }
.chapters i.on { background: var(--gold); }
.mile { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mile div { background: var(--panel-2); border-radius: 10px; padding: 8px; display: grid; gap: 1px; text-align: center; }
.mile div.on { background: var(--gold); color: var(--gold-ink); }
.mile b { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.mile small { font-size: 11.5px; opacity: .8; }
.big-choice { display: grid; gap: 8px; }
.big-choice .btn { justify-content: space-between; min-height: 56px; font-size: 18px; }
.big-choice .btn small { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .75; font-size: 13px; }
.chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.chip-grid button { min-height: 44px; border-radius: 10px; background: var(--panel-2); font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.chip-grid button.on { background: var(--gold); color: var(--gold-ink); }
.chip-grid button[disabled] { opacity: 1; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(10,15,28,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; align-items: center; }
.tab { min-height: 60px; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-family: var(--font-display); font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { color: var(--gold); }
.tab.plus span.disc { width: 54px; height: 54px; border-radius: 16px; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; transform: translateY(-10px); box-shadow: 0 6px 18px rgba(242,179,61,.25); }
.tab.plus svg { width: 26px; height: 26px; color: var(--gold-ink); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(3,6,14,.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--panel); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line); max-height: 88%; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .22s cubic-bezier(.2,.8,.2,1); }
.sheet .wrap { padding-block: 10px 6px; display: grid; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 800; text-transform: uppercase; }
.field { display: grid; gap: 6px; }
.field .err { color: var(--bad); font-size: 13px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; }
.seg button { min-height: 40px; border-radius: 9px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 44px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
@keyframes up { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }

/* Celebrations */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 35; display: grid; justify-items: start; gap: 6px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lower-third { display: flex; align-items: stretch; font-family: var(--font-display); text-transform: uppercase; animation: slide .35s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
.lower-third .tag { background: var(--gold); color: var(--gold-ink); font-weight: 800; padding: 6px 10px; font-size: 15px; letter-spacing: .06em; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); padding-right: 18px; }
.lower-third .txt { background: var(--fg); color: var(--bg); font-weight: 700; padding: 6px 14px 6px 12px; font-size: 15px; letter-spacing: .04em; margin-left: -8px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%); padding-left: 18px; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: none; } }
.levelup { position: fixed; inset: 0; z-index: 50; background: rgba(3,6,14,.85); display: grid; place-items: center; padding: 24px; }
.levelup .box { text-align: center; display: grid; gap: 10px; justify-items: center; animation: pop .45s cubic-bezier(.2,1.4,.3,1); }
.levelup .lv { font-family: var(--font-display); font-weight: 800; font-size: 96px; line-height: .85; color: var(--gold); }
.levelup .t { font-family: var(--font-display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .06em; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
/* Dynasty scoring engine.
   Pure functions: XP, levels, ratings, quests and streaks are computed from the saved
   records every time, never stored. Editing or deleting a record recalculates everything,
   and each record has one key, so a double tap can never pay twice. */
(function (root) {
  'use strict';

  var ATTRS = ['STR', 'CON', 'FUE', 'REC', 'DIS', 'MND', 'CRA', 'CAR', 'WEA', 'BON'];

  /* ---------------- backup ---------------- */
  function backupText() { return JSON.stringify({ app: 'dynasty', version: 2, exportedAt: new Date().toISOString(), settings: { firstBackupOn: S.settings.firstBackupOn || today() }, records: S.records }); }
  function markBackedUp() {
    var prev = S.calc;
    S.settings.lastBackup = Date.now();
    if (!S.settings.firstBackupOn) S.settings.firstBackupOn = today();
    Store.setKV('settings', S.settings);
    S.calc = recompute(); renderBug(); celebrate(prev, S.calc, today());
  }
  function doExport() {
    var txt = backupText(), name = 'dynasty-backup-' + today() + '.json', out = $('#export-out');
    var file; try { file = new File([txt], name, { type: 'application/json' }); } catch (e) {}
    var p = Promise.reject();
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) p = navigator.share({ files: [file], title: 'Dynasty backup' });
    p.then(function () { markBackedUp(); toast('Saved', 'Backup file shared'); render(); }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      try {
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) {}
      if (out) out.innerHTML = '<p class="notice">If no file appeared, use Copy backup text and paste it into a note or file. The backup has ' + S.records.length + ' entries.</p>';
      markBackedUp();
    });
  }
  function doCopy() {

    try {
      navigator.clipboard.writeText(txt).then(function () { markBackedUp(); toast('Copied', S.records.length + ' entries'); out.innerHTML = '<p class="notice">Copied. Paste it into a note or a file in iCloud Drive.</p>'; }, function () { show(); markBackedUp(); });
    } catch (e) { show(); markBackedUp(); }
  }
  function restoreSheet() {
    sheet('<h3>Restore backup</h3><p class="notice warn">Restoring replaces everything on this device with the backup.</p>' +
      '<div class="field"><label class="label" for="bk-file">Choose a backup file</label><input id="bk-file" type="file" accept="application/json,.json,text/plain"></div>' +
      '<div class="field"><label class="label" for="bk-paste">Or paste backup text</label><textarea id="bk-paste" placeholder="{&quot;app&quot;:&quot;dynasty&quot;, ...}"></textarea></div>' +
      '<div class="err" id="err" aria-live="polite"></div><div class="row-actions"><button class="btn gold" id="go">Replace my data</button><button class="btn ghost" id="cancel">Cancel</button></div>', function (sh) {
      $('#cancel', sh).onclick = closeSheet;
      var fileTxt = null;
      $('#bk-file', sh).onchange = function (e) { var f = e.target.files[0]; if (!f) return; var fr = new FileReader(); fr.onload = function () { fileTxt = fr.result; $('#err', sh).textContent = ''; }; fr.readAsText(f); };
      $('#go', sh).onclick = function () {
        var raw = fileTxt || $('#bk-paste', sh).value.trim(), data;
        try { data = JSON.parse(raw); } catch (e) { $('#err', sh).textContent = 'That isn’t a Dynasty backup. Choose the .json file or paste the full text.'; return; }
        if (!data || data.app !== 'dynasty' || !Array.isArray(data.records)) { $('#err', sh).textContent = 'That file isn’t a Dynasty backup.'; return; }
        var clean = data.records.filter(function (r) { return r && typeof r.type === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date); })
          .map(function (r) { return { key: typeof r.key === 'string' && r.key.indexOf(r.type + ':' + r.date) === 0 ? r.key : r.type + ':' + r.date, type: r.type, date: r.date, value: r.value, createdAt: r.createdAt || r.updatedAt || 0, updatedAt: r.updatedAt || 0 }; });
        if (data.settings && data.settings.firstBackupOn) { S.settings.firstBackupOn = data.settings.firstBackupOn; Store.setKV('settings', S.settings); }
        Store.replaceAll(clean).then(reload).then(function () { closeSheet(); toast('Restored', clean.length + ' entries'); });
      };
    });
  }
  function confirmDelete(key) {

      '<div class="row-actions"><button class="btn danger" id="yes">Delete</button><button class="btn ghost" id="cancel">Keep it</button></div>', function (sh) {

  /* ---------------- events ---------------- */
  var busy = false;
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (tab) { S.tab = tab.dataset.tab; if (S.tab === 'log') S.logOffset = 0; render(); window.scrollTo(0, 0); return; }
    var btn = e.target.closest('[data-act]'); if (!btn || btn.tagName === 'INPUT') return;
    var act = btn.dataset.act, row = btn.closest('.habit');
    var h = row && row.dataset.habit, date = (row && row.dataset.date) || btn.dataset.date || today();
    if (busy && (act === 'water-plus' || act === 'water-minus' || act === 'toggle')) return;
    var guard = function (p) { busy = true; p.then(function () { busy = false; }, function () { busy = false; }); };
    switch (act) {
      case 'water-plus': var w = rec('water', date); guard(save('water', date, Math.min(10, (w ? w.value : 0) + 1))); break;
      case 'water-minus': var w2 = rec('water', date); if (w2) guard(save('water', date, Math.max(0, w2.value - 1))); break;
      case 'toggle': var t = rec(h, date); guard(save(h, date, t && t.value ? null : true)); break;
      case 'steps': stepsSheet(date); break;
      case 'read': readSheet(date); break;
      case 'sleep': sleepSheet(date); break;
      case 'bonds': bondsSheet(date); break;
      case 'echo': echoSheet(date); break;
      case 'career': careerSheet(date); break;
      case 'wealth': wealthSheet(date); break;
      case 'go-quests': S.tab = 'quests'; render(); window.scrollTo(0, 0); break;
      case 'log-day': S.logOffset = Number(btn.dataset.off); render(); break;
      case 'export': doExport(); break;
      case 'copy': doCopy(); break;
      case 'restore': restoreSheet(); break;
      case 'del': confirmDelete(btn.dataset.key); break;
      case 'go-season': S.tab = 'season'; render(); window.scrollTo(0, 0); break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sound') { S.settings.sound = e.target.checked; Store.setKV('settings', S.settings); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  // A new day can start while the app sits open.
  var lastDay = today();
  document.addEventListener('visibilitychange', function () { if (!document.hidden && today() !== lastDay) { lastDay = today(); S.calc = recompute(); render(); } });
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); S.calc = recompute(); render(); } }, 60000);

  /* ---------------- install bits (only when running as its own site) ---------------- */
  if (!inFrame) {
    try {
      var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
      var ic = document.createElement('link'); ic.rel = 'apple-touch-icon'; ic.href = 'icon-180.png'; document.head.appendChild(ic);
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
    } catch (e) {}
  }

  /* ---------------- boot ---------------- */
  Store.init().then(function () { return Store.getKV('settings'); }).then(function (s) {
    if (s) { S.settings.sound = s.sound !== false; S.settings.lastBackup = s.lastBackup || null; S.settings.firstBackupOn = s.firstBackupOn || (s.lastBackup ? E.localToday(new Date(s.lastBackup)) : null); }
    return reload();
  }).catch(function (e) {
    $('#view').innerHTML = '<section class="view"><p class="notice warn">Dynasty couldn’t open its storage. Close and reopen the app. If it keeps happening, restore from your latest backup.</p></section>';
    console.error(e);
  });
})();
</script>
</body></html>
